gpu_plugin = 'xenos'
# Graphics API: 'auto' (Direct3D 12 on Windows), 'd3d12' or 'vulkan'.
gpu_backend = 'auto'
fullscreen = false
game_data_root = 'game'
log_level = 'info'
mnk_mode = true
show_fps_counter = false
# Skate has no quit option: Escape or RB+Start opens a "Quit the game?" dialog.
quit_dialog = true
keybind_a = 'Space'
keybind_b = 'Control'
keybind_x = 'Shift'
keybind_y = 'T'
keybind_start = 'Return'
keybind_dpad_up = 'Up'
keybind_dpad_down = 'Down'
keybind_dpad_left = 'Left'
keybind_dpad_right = 'Right'
keybind_lstick_up = 'W'
keybind_lstick_down = 'S'
keybind_lstick_left = 'A'
keybind_lstick_right = 'D'
keybind_lstick_press = 'Z'
# Binds Skate 1 relied on as SDK defaults before 0.10, pinned here because the
# 0.10 defaults moved them (triggers to Q/E, back to Z which clashes above).
keybind_left_trigger = 'RMB'
keybind_right_trigger = 'LMB'
keybind_left_shoulder = 'Q'
keybind_right_shoulder = 'R'
keybind_rstick_press = 'MMB'
keybind_back = 'Tab'
# SDK 0.10 can drive the right stick from keys and defaults those to the arrow
# keys, which Skate 1 uses for the d-pad. Keep the right stick on the mouse.
mnk_mouse = true
keybind_rstick_up = ''
keybind_rstick_down = ''
keybind_rstick_left = ''
keybind_rstick_right = ''
d3d12_frame_latency_waitable_object = true
d3d12_max_frame_latency = 1
vsync = true
depth_float24_convert_in_pixel_shader = true
depth_float24_round = true
clear_memory_page_state = true
# Off for now: the game resolves the photo target every frame, so forcing its
# readback (983040) drains the GPU every frame and halves FPS on SDK 0.10.
# MAG cover / saved photos may be black until a non-stalling readback lands.
readback_resolve_force_length = 0
# Internal render resolution: 1 = the original 720p, 2 = 1440p (heavier).
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
